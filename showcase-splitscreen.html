<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzersef - Luxury Auto-Playing Centered 3D Card Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --primary: #073B35;
      --accent: #0B5F55;
      --gold: #E3A92F;
      --paper: #F6F1E7;
    }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      background: var(--paper);
      color: var(--primary);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      background: rgba(11, 95, 85, 0.1);
      border: 1px solid rgba(11, 95, 85, 0.25);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 800;
      margin-bottom: 0.8rem;
    }
    .title {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      color: var(--primary);
      line-height: 1.2;
    }
    .desc {
      font-size: 0.95rem;
      color: #4d6560;
      max-width: 580px;
      margin: 0.5rem auto 0;
    }
    /* Centered 3D Card Deck Stage */
    .stage {
      position: relative;
      width: 100%;
      height: 580px;
      background: radial-gradient(circle at center, #ffffff 0%, #ede7db 100%);
      border: 2px solid rgba(7, 59, 53, 0.15);
      border-radius: 32px;
      box-shadow: 0 25px 60px rgba(7, 59, 53, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .orbit-ring {
      position: absolute;
      width: 580px;
      height: 580px;
      border-radius: 50%;
      border: 1.5px dashed rgba(11, 95, 85, 0.18);
      pointer-events: none;
    }
    .deck {
      position: relative;
      width: 360px;
      height: 490px;
    }
    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      border-radius: 26px;
      overflow: hidden;
      background: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: 0 20px 50px rgba(7, 59, 53, 0.35);
      will-change: transform, opacity;
      transform-origin: center center;
      user-select: none;
    }
    .card.front {
      border-color: var(--gold);
      box-shadow: 0 25px 60px rgba(7, 59, 53, 0.45);
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(7, 59, 53, 0.96) 0%, rgba(7, 59, 53, 0.45) 50%, rgba(0,0,0,0.2) 100%);
      pointer-events: none;
    }
    .card-top {
      position: absolute;
      top: 16px;
      right: 16px;
      left: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    .badge-card {
      background: var(--gold);
      color: var(--primary);
      font-weight: 900;
      font-size: 0.72rem;
      padding: 4px 12px;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .num-card {
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .card-bottom {
      position: absolute;
      bottom: 0;
      right: 0;
      left: 0;
      padding: 22px;
      color: #fff;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-category {
      font-size: 0.75rem;
      font-weight: 800;
      color: #6ee7b7;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 900;
      line-height: 1.2;
    }
    .card-desc {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.45;
    }
    .card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      padding-top: 10px;
      margin-top: 4px;
    }
    .card-price {
      font-size: 0.88rem;
      font-family: monospace;
      font-weight: 900;
      color: var(--gold);
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 8px;
    }
    .card-btn {
      background: var(--gold);
      color: var(--primary);
      font-weight: 900;
      font-size: 0.82rem;
      padding: 8px 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .controls {
      position: absolute;
      bottom: 16px;
      right: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: 16px;
      border: 1px solid rgba(7, 59, 53, 0.15);
      z-index: 20;
    }
    .dots {
      display: flex;
      gap: 6px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cbd5e1;
      cursor: pointer;
      transition: all 0.3s;
    }
    .dot.active {
      width: 26px;
      border-radius: 9999px;
      background: var(--accent);
    }
    @media (max-width: 640px) {
      .deck {
        width: 300px;
        height: 420px;
      }
      .stage {
        height: 500px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="badge">✦ كتالوج الخدمات والمنتجات المعتمدة بأسوان</div>
      <h1 class="title">خدمات الطباعة والتطريز في أسوان</h1>
      <p class="desc">استعراض متزامن وديناميكي لكل الأقسام — كابات، هوديز، استيكرات، مجات وجرابات بأعلى جودة تنفيذ.</p>
    </div>

    <div class="stage" id="stage">
      <div class="orbit-ring"></div>
      <div class="deck" id="deck"></div>

      <div class="controls">
        <span style="font-size: 0.8rem; font-weight: 900;">YUZERSEF · ASWAN</span>
        <div class="dots" id="dots"></div>
        <span id="counter" style="font-family: monospace; font-size: 0.78rem;">01 / 06</span>
      </div>
    </div>
  </div>

  <script>
    const ITEMS = [
      {
        num: '01',
        title: 'هوديز وتيشرتات قطن مصري فاخر',
        category: 'ملابس قطن 100%',
        price: 'يبدأ من 180 ج.م',
        badge: 'الأعلى تقييماً',
        image: '/realistic/tshirt_hoodie_showcase_1792774343099.jpg',
        desc: 'طباعة DTF فوتوغرافية وتطريز بارز على خامات قطن مصري عالية الكثافة مع تقفيل خياطة دبل.'
      },
      {
        num: '02',
        title: 'كابات ومطرزات ميتاليك بارزة 3D',
        category: 'تطريز ذهبي وفضي',
        price: 'يبدأ من 95 ج.م',
        badge: 'تطريز ثلاثي الأبعاد',
        image: '/realistic/cap_embroidery_showcase_1792774344249.jpg',
        desc: 'كابات بيسبول وسناب باك احترافية بتطريز ميتاليك فاخر بخيوط حريرية متراصة ومقاومة للغسيل.'
      },
      {
        num: '03',
        title: 'استيكرات Die-Cut وجرابات هواتف',
        category: 'فينيل ألماني وطباعة UV',
        price: 'يبدأ من 50 ج.م',
        badge: 'مقاوم للماء والشمس',
        image: '/realistic/stickers_phonecase_showcase_1792774346393.jpg',
        desc: 'قص ليزري دقيق على حدود التصميم وشعارات بارزة للموبايل بجودة ألوان فائقة الثبات.'
      },
      {
        num: '04',
        title: 'مجّات سيراميك وهدايا تذكارية',
        category: 'سيراميك وسبلميشن',
        price: 'يبدأ من 85 ج.م',
        badge: 'هدايا وبوكسات شركات',
        image: '/realistic/mug_and_gift_showcase_1792774344969.jpg',
        desc: 'مجّات سيراميك ناصعة ومجّات سحرية حرارية وثرامس وبوكسات تذكارية للهدايا والمناسبات.'
      },
      {
        num: '05',
        title: 'الباقة الملكية المتكاملة ليوزرسيف',
        category: 'المجموعة الكاملة',
        price: 'عروض مخصصة',
        badge: 'إصدار فاخر',
        image: '/showcase/luxury-flat-lay.png',
        desc: 'تنفيذ متزامن للهوية الكاملة: ملابس، كابات مطرزة، نوت بوك، واستيكرات مخصصة لبراندات أسوان.'
      },
      {
        num: '06',
        title: 'تيشيرت أسود كاجوال قطن ممشط',
        category: 'كاجوال ستريت وير',
        price: 'يبدأ من 160 ج.م',
        badge: 'تسليم سريع',
        image: '/realistic/realistic_tshirt_black_yuzersef_1792775730619.jpg',
        desc: 'خامة قطنية مريحة معالجة ضد الانكماش مع طباعة صدر وظهر متدرجة الألوان بجودة عالية.'
      }
    ];

    const N = ITEMS.length;
    const DURATION = 12; // 12 seconds per loop

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function wrap(d, n) {
      return ((d + n / 2) % n + n) % n - n / 2;
    }

    const deck = document.getElementById('deck');
    const dotsContainer = document.getElementById('dots');
    const counter = document.getElementById('counter');

    const cardElements = ITEMS.map((item, i) => {
      const el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = `
        <img src="${item.image}" alt="${item.title}">
        <div class="card-scrim"></div>
        <div class="card-top">
          <span class="badge-card">${item.badge}</span>
          <span class="num-card">${item.num} / 0${N}</span>
        </div>
        <div class="card-bottom">
          <span class="card-category">${item.category}</span>
          <h3 class="card-title">${item.title}</h3>
          <p class="card-desc">${item.desc}</p>
          <div class="card-row">
            <span class="card-price">${item.price}</span>
            <button class="card-btn">صمم طلبك ↗</button>
          </div>
        </div>
      `;
      deck.appendChild(el);
      return el;
    });

    const dotElements = ITEMS.map((item, i) => {
      const dot = document.createElement('div');
      dot.className = `dot ${i === 0 ? 'active' : ''}`;
      dotsContainer.appendChild(dot);
      return dot;
    });

    let startTime = null;

    function render(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = (timestamp - startTime) / 1000;
      const x = (elapsed / DURATION * N) % N;
      const p = Math.floor(x) + easeInOutCubic(x % 1);

      const activeIdx = Math.round(p) % N;
      counter.textContent = `0${activeIdx + 1} / 0${N}`;

      dotElements.forEach((dot, idx) => {
        dot.className = `dot ${idx === activeIdx ? 'active' : ''}`;
      });

      for (let i = 0; i < N; i++) {
        const d = wrap(i - p, N);
        const absD = Math.abs(d);
        const el = cardElements[i];

        if (absD > 3.2) {
          el.style.display = 'none';
          continue;
        }
        el.style.display = 'block';

        const tx = d * 78;
        const ty = d * -16;
        const rot = d * 6.5;
        const scale = Math.max(0.68, 1 - absD * 0.075);
        const opacity = Math.max(0, 1 - absD * 0.28);
        const zIndex = Math.round(50 - absD * 10);

        el.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) rotate(${rot}deg) scale(${scale})`;
        el.style.opacity = opacity;
        el.style.zIndex = zIndex;

        if (absD < 0.5) {
          el.classList.add('front');
        } else {
          el.classList.remove('front');
        }
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
